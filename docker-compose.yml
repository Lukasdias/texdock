services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-texdock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-texdock}
      POSTGRES_DB: ${POSTGRES_DB:-texdock}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-texdock}"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-texdock}:${POSTGRES_PASSWORD:-texdock}@db:5432/${POSTGRES_DB:-texdock}
      TEST_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-texdock}:${POSTGRES_PASSWORD:-texdock}@db:5432/${POSTGRES_DB:-texdock}_test
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
